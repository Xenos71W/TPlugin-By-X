name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: List project files
        run: find . -name '*.csproj' -not -path './.git/*'

      - name: Build all plugins
        run: |
          set -e
          find . -name '*.csproj' -not -path './.git/*' | while read -r proj; do
            echo "=== Building $proj ==="
            dotnet build "$proj" -c Release
          done

      - name: Upload plugin DLLs
        uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: |
            **/bin/Release/net9.0/BossFocus.dll
            **/bin/Release/net9.0/MagicBuilder.dll
          if-no-files-found: error
