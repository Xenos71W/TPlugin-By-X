name: Build All TShock Plugins

on:
  push:
    branches: [ main, master ]
    tags-ignore:
      - 'V1.0.0.0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Compile file bahasa i18n (jika ada)
        shell: pwsh
        run: |
          $poFiles = Get-ChildItem -Path "src" -Filter "*.po" -Recurse -ErrorAction SilentlyContinue
          if ($poFiles) {
            sudo apt-get update && sudo apt-get install -y gettext
            foreach ($p in $poFiles) {
              $moPath = [System.IO.Path]::ChangeExtension($p.FullName, ".mo")
              msgfmt -o "$moPath" "$($p.FullName)"
            }
          }

      - name: Build semua plugin di folder src
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "out/Plugins" | Out-Null
          $projects = Get-ChildItem -Path "src" -Filter "*.csproj" -Recurse

          if (-not $projects) {
            Write-Error "Tidak ada file .csproj ditemukan di dalam folder src!"
            exit 1
          }

          foreach ($proj in $projects) {
            Write-Host "=== Building $($proj.BaseName) ==="
            dotnet build $proj.FullName -c Release -o "out/temp/$($proj.BaseName)"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $dll = Get-ChildItem -Path "out/temp/$($proj.BaseName)" -Filter "$($proj.BaseName).dll" | Select-Object -First 1
            if (-not $dll) {
              $dll = Get-ChildItem -Path "out/temp/$($proj.BaseName)" -Filter "*.dll" | Where-Object {
                $_.Name -notmatch '^(System\.|Microsoft\.|TShockAPI|OTAPI|TerrariaServer|Newtonsoft|ModFramework|HttpServer|BCrypt|MySql|Microsoft\.Data)'
              } | Select-Object -First 1
            }

            if ($dll) {
              Copy-Item $dll.FullName -Destination "out/Plugins/" -Force
            }
          }

          Compress-Archive -Path "out/Plugins/*" -DestinationPath "out/AllPlugins.zip" -Force

      - name: Upload ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TShock-Plugins
          path: out/Plugins/*.dll

      - name: Update Tag Release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f V1.0.0.0
          git push -f origin V1.0.0.0

      - name: Publish ke halaman Releases
        uses: ncipollo/release-action@v1
        with:
          tag: V1.0.0.0
          name: "Latest Plugins Build"
          body: |
            Update otomatis seluruh file `.dll` hasil compile dari folder `src/`.
            Download `AllPlugins.zip` atau pilih file `.dll` satuan di bawah ini.
          artifacts: |
            out/AllPlugins.zip
            out/Plugins/*.dll
          allowUpdates: true
          removeArtifacts: true
          
